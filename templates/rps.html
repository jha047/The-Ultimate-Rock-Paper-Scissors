<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Rock Paper Scissors</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- MAIN MENU STYLES --- */
        .menu-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .star {
            position: absolute;
            font-size: 24px;
            user-select: none;
        }

        .game-title {
            color: #000000;
            font-size: 48px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
            margin-bottom: 60px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .play-btn {
            background-color: #8A2BE2;
            color: #FFFFFF;
            font-size: 22px;
            font-weight: bold;
            padding: 16px 36px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            z-index: 2;
            box-shadow: 0px 6px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }

        .play-btn:hover {
            transform: scale(1.05);
            background-color: #9B30FF;
        }

        /* --- GAME ARENA STYLES --- */
        .game-container {
            width: 100%;
            height: 100%;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .score-board {
            display: flex;
            gap: 60px;
            background: #F0F0F0;
            padding: 15px 40px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            margin-top: 10px;
        }

        .score-box {
            text-align: center;
        }

        .score-title {
            font-size: 14px;
            color: #666;
            font-weight: bold;
            text-transform: uppercase;
        }

        .score-num {
            font-size: 36px;
            font-weight: bold;
            color: #222;
        }

        .arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            height: 350px;
        }

        .hand-container {
            width: 350px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .human-hand {
            transform: scaleX(1);
        }

        .ai-hand {
            transform: scaleX(-1);
        }

        /* --- ANIMATIONS --- */
        .animate-player {
            animation: playerThrow 0.5s ease-in-out;
        }

        .animate-ai {
            animation: aiThrow 0.5s ease-in-out;
        }

        @keyframes playerThrow {
            0% { transform: scaleX(1) translateY(0) rotate(0deg); }
            25% { transform: scaleX(1) translateY(-20px) rotate(10deg); }
            50% { transform: scaleX(1) translateY(10px) rotate(-5deg); }
            75% { transform: scaleX(1) translateY(-10px) rotate(5deg); }
            100% { transform: scaleX(1) translateY(0) rotate(0deg); }
        }

        @keyframes aiThrow {
            0% { transform: scaleX(-1) translateY(0) rotate(0deg); }
            25% { transform: scaleX(-1) translateY(-20px) rotate(10deg); }
            50% { transform: scaleX(-1) translateY(10px) rotate(-5deg); }
            75% { transform: scaleX(-1) translateY(-10px) rotate(5deg); }
            100% { transform: scaleX(-1) translateY(0) rotate(0deg); }
        }

        .status-message {
            font-size: 22px;
            font-weight: bold;
            color: #333;
            height: 30px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .choice-btn {
            position: relative;
            background-color: #FF7F50;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
            transition: background-color 0.2s, transform 0.1s;
        }

        .choice-btn:hover, .choice-btn.active-key {
            background-color: #FF5722;
            transform: translateY(-2px);
        }

        .key-badge {
            background-color: rgba(0, 0, 0, 0.25);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 12px;
            margin-left: 6px;
        }

        .reset-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid #ccc;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            color: #666;
        }
    </style>
</head>
<body>

    {% if not game_started %}
    <div class="menu-container">
        <span class="star" style="top: 10%; left: 15%; color: #FFD700;">★</span>
        <span class="star" style="top: 25%; left: 80%; color: #FFCC00;">✦</span>
        <span class="star" style="top: 70%; left: 10%; color: #E6B800;">★</span>
        <span class="star" style="top: 80%; left: 85%; color: #FFD700;">✦</span>
        <span class="star" style="top: 15%; left: 60%; color: #FFCC00;">★</span>
        <span class="star" style="top: 65%; left: 40%; color: #FFD700;">✦</span>

        <h1 class="game-title">The Ultimate Rock Paper Scissors</h1>

        <form method="POST">
            <input type="hidden" name="action" value="start">
            <button type="submit" class="play-btn">Tap to Play ▶️</button>
        </form>
    </div>

    {% else %}
    <div class="game-container">
        <form method="POST">
            <input type="hidden" name="action" value="reset">
            <button type="submit" class="reset-btn">Main Menu</button>
        </form>

        <div class="score-board">
            <div class="score-box">
                <div class="score-title">PLAYER</div>
                <div id="playerScore" class="score-num">{{ player_score }}</div>
            </div>
            <div class="score-box">
                <div class="score-title">AI ROBOT</div>
                <div id="aiScore" class="score-num">{{ computer_score }}</div>
            </div>
        </div>

        <div id="statusMessage" class="status-message">
            {% if result_message %}
                {{ result_message }}
            {% else %}
                Make your move! (Use buttons or press R, P, S)
            {% endif %}
        </div>

        <div class="arena">
            <div id="playerHand" class="hand-container human-hand {% if player_choice %}animate-player{% endif %}">
                <svg width="250" height="200" viewBox="0 0 200 150">
                    <path d="M 0 65 L 70 65 C 80 65 90 70 90 80 L 90 100 C 90 110 80 115 70 115 L 0 115 Z" fill="#E0A96D" />

                    {% if player_choice == 'paper' %}
                        <rect x="70" y="45" width="90" height="15" rx="7" fill="#E0A96D" />
                        <rect x="70" y="65" width="95" height="15" rx="7" fill="#E0A96D" />
                        <rect x="70" y="85" width="90" height="15" rx="7" fill="#E0A96D" />
                        <rect x="70" y="105" width="80" height="15" rx="7" fill="#E0A96D" />
                    {% elif player_choice == 'scissors' %}
                        <rect x="70" y="55" width="95" height="16" rx="8" fill="#E0A96D" transform="rotate(-10 70 55)" />
                        <rect x="70" y="80" width="95" height="16" rx="8" fill="#E0A96D" transform="rotate(10 70 80)" />
                        <rect x="65" y="102" width="40" height="20" rx="10" fill="#D1975B" />
                    {% else %}
                        <rect x="70" y="50" width="70" height="70" rx="20" fill="#E0A96D" />
                        <rect x="80" y="55" width="20" height="60" rx="10" fill="#D1975B" />
                        <rect x="105" y="55" width="20" height="60" rx="10" fill="#C2854A" />
                    {% endif %}
                </svg>
            </div>

            <div id="aiHand" class="hand-container ai-hand {% if computer_choice %}animate-ai{% endif %}">
                <svg width="250" height="200" viewBox="0 0 200 150">
                    <path d="M 0 65 L 70 65 C 80 65 90 70 90 80 L 90 100 C 90 110 80 115 70 115 L 0 115 Z" fill="#2B2C2C" />
                    <line x1="10" y1="90" x2="60" y2="90" stroke="#00E5FF" stroke-width="4" />

                    {% if computer_choice == 'paper' %}
                        <rect x="70" y="45" width="90" height="15" rx="4" fill="#4A4D4E" stroke="#00E5FF" stroke-width="1" />
                        <rect x="70" y="65" width="95" height="15" rx="4" fill="#3A3C3D" stroke="#00E5FF" stroke-width="1" />
                        <rect x="70" y="85" width="90" height="15" rx="4" fill="#2B2C2C" />
                        <rect x="70" y="105" width="80" height="15" rx="4" fill="#1F2020" />
                    {% elif computer_choice == 'scissors' %}
                        <rect x="70" y="55" width="95" height="16" rx="4" fill="#4A4D4E" stroke="#00E5FF" stroke-width="1" transform="rotate(-10 70 55)" />
                        <rect x="70" y="80" width="95" height="16" rx="4" fill="#3A3C3D" stroke="#00E5FF" stroke-width="1" transform="rotate(10 70 80)" />
                        <rect x="65" y="102" width="40" height="20" rx="5" fill="#1F2020" />
                    {% else %}
                        <rect x="70" y="45" width="75" height="75" rx="15" fill="#4A4D4E" />
                        <rect x="80" y="50" width="18" height="65" rx="5" fill="#1F2020" />
                        <rect x="103" y="50" width="18" height="65" rx="5" fill="#111212" />
                        <rect x="126" y="50" width="18" height="65" rx="5" fill="#4A4D4E" />
                    {% endif %}
                </svg>
            </div>
        </div>

        <div class="controls">
            <button type="button" onclick="playMove('rock')" class="choice-btn" data-action="rock">✊ Rock <span class="key-badge">R</span></button>
            <button type="button" onclick="playMove('paper')" class="choice-btn" data-action="paper">✋ Paper <span class="key-badge">P</span></button>
            <button type="button" onclick="playMove('scissors')" class="choice-btn" data-action="scissors">✌️ Scissors <span class="key-badge">S</span></button>
        </div>
    </div>

    <script>
        // Clear cached page state on navigation/load so it never re-opens inside an unfinished game
        if (window.performance && window.performance.navigation.type === window.performance.navigation.TYPE_BACK_FORWARD) {
            window.location.reload();
        }

        // SVG Templates for Dynamic Updating
        const playerSvgTemplates = {
            rock: `<svg width="250" height="200" viewBox="0 0 200 150">
                    <path d="M 0 65 L 70 65 C 80 65 90 70 90 80 L 90 100 C 90 110 80 115 70 115 L 0 115 Z" fill="#E0A96D" />
                    <rect x="70" y="50" width="70" height="70" rx="20" fill="#E0A96D" />
                    <rect x="80" y="55" width="20" height="60" rx="10" fill="#D1975B" />
                    <rect x="105" y="55" width="20" height="60" rx="10" fill="#C2854A" />
                   </svg>`,
            paper: `<svg width="250" height="200" viewBox="0 0 200 150">
                    <path d="M 0 65 L 70 65 C 80 65 90 70 90 80 L 90 100 C 90 110 80 115 70 115 L 0 115 Z" fill="#E0A96D" />
                    <rect x="70" y="45" width="90" height="15" rx="7" fill="#E0A96D" />
                    <rect x="70" y="65" width="95" height="15" rx="7" fill="#E0A96D" />
                    <rect x="70" y="85" width="90" height="15" rx="7" fill="#E0A96D" />
                    <rect x="70" y="105" width="80" height="15" rx="7" fill="#E0A96D" />
                    </svg>`,
            scissors: `<svg width="250" height="200" viewBox="0 0 200 150">
                    <path d="M 0 65 L 70 65 C 80 65 90 70 90 80 L 90 100 C 90 110 80 115 70 115 L 0 115 Z" fill="#E0A96D" />
                    <rect x="70" y="55" width="95" height="16" rx="8" fill="#E0A96D" transform="rotate(-10 70 55)" />
                    <rect x="70" y="80" width="95" height="16" rx="8" fill="#E0A96D" transform="rotate(10 70 80)" />
                    <rect x="65" y="102" width="40" height="20" rx="10" fill="#D1975B" />
                    </svg>`
        };

        const aiSvgTemplates = {
            rock: `<svg width="250" height="200" viewBox="0 0 200 150">
                    <path d="M 0 65 L 70 65 C 80 65 90 70 90 80 L 90 100 C 90 110 80 115 70 115 L 0 115 Z" fill="#2B2C2C" />
                    <line x1="10" y1="90" x2="60" y2="90" stroke="#00E5FF" stroke-width="4" />
                    <rect x="70" y="45" width="75" height="75" rx="15" fill="#4A4D4E" />
                    <rect x="80" y="50" width="18" height="65" rx="5" fill="#1F2020" />
                    <rect x="103" y="50" width="18" height="65" rx="5" fill="#111212" />
                    <rect x="126" y="50" width="18" height="65" rx="5" fill="#4A4D4E" />
                   </svg>`,
            paper: `<svg width="250" height="200" viewBox="0 0 200 150">
                    <path d="M 0 65 L 70 65 C 80 65 90 70 90 80 L 90 100 C 90 110 80 115 70 115 L 0 115 Z" fill="#2B2C2C" />
                    <line x1="10" y1="90" x2="60" y2="90" stroke="#00E5FF" stroke-width="4" />
                    <rect x="70" y="45" width="90" height="15" rx="4" fill="#4A4D4E" stroke="#00E5FF" stroke-width="1" />
                    <rect x="70" y="65" width="95" height="15" rx="4" fill="#3A3C3D" stroke="#00E5FF" stroke-width="1" />
                    <rect x="70" y="85" width="90" height="15" rx="4" fill="#2B2C2C" />
                    <rect x="70" y="105" width="80" height="15" rx="4" fill="#1F2020" />
                    </svg>`,
            scissors: `<svg width="250" height="200" viewBox="0 0 200 150">
                    <path d="M 0 65 L 70 65 C 80 65 90 70 90 80 L 90 100 C 90 110 80 115 70 115 L 0 115 Z" fill="#2B2C2C" />
                    <line x1="10" y1="90" x2="60" y2="90" stroke="#00E5FF" stroke-width="4" />
                    <rect x="70" y="55" width="95" height="16" rx="4" fill="#4A4D4E" stroke="#00E5FF" stroke-width="1" transform="rotate(-10 70 55)" />
                    <rect x="70" y="80" width="95" height="16" rx="4" fill="#3A3C3D" stroke="#00E5FF" stroke-width="1" transform="rotate(10 70 80)" />
                    <rect x="65" y="102" width="40" height="20" rx="5" fill="#1F2020" />
                    </svg>`
        };

        async function playMove(move) {
            const button = document.querySelector(`.choice-btn[data-action="${move}"]`);
            if (button) {
                button.classList.add('active-key');
                setTimeout(() => button.classList.remove('active-key'), 150);
            }

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: move })
                });

                if (response.ok) {
                    const data = await response.json();

                    // Update SVG hand graphics
                    const playerHand = document.getElementById('playerHand');
                    const aiHand = document.getElementById('aiHand');

                    playerHand.innerHTML = playerSvgTemplates[data.player_choice];
                    aiHand.innerHTML = aiSvgTemplates[data.computer_choice];

                    // Trigger smooth throw animations
                    playerHand.classList.remove('animate-player');
                    aiHand.classList.remove('animate-ai');
                    void playerHand.offsetWidth; // Trigger DOM reflow
                    playerHand.classList.add('animate-player');
                    aiHand.classList.add('animate-ai');

                    // Update status and scores
                    document.getElementById('statusMessage').innerText = data.result_message;
                    document.getElementById('playerScore').innerText = data.player_score;
                    document.getElementById('aiScore').innerText = data.computer_score;
                }
            } catch (error) {
                console.error("Error sending move:", error);
            }
        }

        // Global Keyboard Shortcut Handler (R, P, S)
        document.addEventListener('keydown', function(event) {
            const key = event.key.toLowerCase();
            if (key === 'r') playMove('rock');
            else if (key === 'p') playMove('paper');
            else if (key === 's') playMove('scissors');
        });
    </script>
    {% endif %}

</body>
</html>
